<svg width="1200" height="1400" viewBox="0 0 1200 1400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Realistic luxury hookah model</title>
  <desc id="desc">A dark metal and antique gold lounge hookah with glass base and smoke.</desc>
  <defs>
    <radialGradient id="glassGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#9F7E4D" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#2B1A10" stop-opacity=".58"/>
      <stop offset="1" stop-color="#050403" stop-opacity=".92"/>
    </radialGradient>
    <linearGradient id="gold" x1="360" y1="150" x2="760" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2D997"/>
      <stop offset=".16" stop-color="#B9904A"/>
      <stop offset=".42" stop-color="#6E4A22"/>
      <stop offset=".62" stop-color="#E0BD73"/>
      <stop offset="1" stop-color="#3B2816"/>
    </linearGradient>
    <linearGradient id="blackMetal" x1="350" y1="260" x2="820" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31302C"/>
      <stop offset=".22" stop-color="#090807"/>
      <stop offset=".54" stop-color="#1C1A17"/>
      <stop offset=".76" stop-color="#050403"/>
      <stop offset="1" stop-color="#37322A"/>
    </linearGradient>
    <linearGradient id="smoke" x1="440" y1="0" x2="720" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".36" stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset=".74" stop-color="#D8C6A1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="38" stdDeviation="34" flood-color="#000000" flood-opacity=".72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#C8A45D" flood-opacity=".16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <g opacity=".92" filter="url(#softBlur)">
    <path d="M620 24C514 138 708 196 573 325C489 406 584 486 530 586" stroke="url(#smoke)" stroke-width="52" stroke-linecap="round"/>
    <path d="M742 72C622 180 795 245 658 372C585 440 646 505 605 612" stroke="url(#smoke)" stroke-width="38" stroke-linecap="round" opacity=".72"/>
    <path d="M488 90C402 190 536 260 456 365C398 442 463 522 420 620" stroke="url(#smoke)" stroke-width="34" stroke-linecap="round" opacity=".52"/>
  </g>

  <ellipse cx="607" cy="1225" rx="330" ry="76" fill="#000" opacity=".58" filter="url(#softBlur)"/>

  <g filter="url(#shadow)">
    <path d="M474 919C497 853 545 818 604 818C665 818 713 856 735 920L784 1073C812 1161 742 1245 604 1245C466 1245 396 1161 424 1073L474 919Z" fill="url(#glassGlow)" stroke="#B89552" stroke-width="8"/>
    <path d="M478 1031C541 1063 671 1063 733 1031L752 1092C713 1132 494 1132 456 1092L478 1031Z" fill="#B89552" opacity=".22"/>
    <ellipse cx="604" cy="918" rx="132" ry="42" fill="#11100E" stroke="#D8BC79" stroke-width="7"/>
    <ellipse cx="604" cy="1220" rx="180" ry="42" fill="#070605" stroke="#866533" stroke-width="7"/>

    <rect x="574" y="356" width="60" height="553" rx="30" fill="url(#gold)" stroke="#F1D493" stroke-width="5"/>
    <rect x="554" y="505" width="100" height="86" rx="18" fill="url(#blackMetal)" stroke="#B89552" stroke-width="6"/>
    <rect x="540" y="664" width="128" height="72" rx="22" fill="url(#blackMetal)" stroke="#B89552" stroke-width="6"/>
    <ellipse cx="604" cy="350" rx="118" ry="34" fill="url(#gold)" stroke="#F3DA9B" stroke-width="5"/>
    <ellipse cx="604" cy="742" rx="182" ry="38" fill="url(#gold)" stroke="#6E4A22" stroke-width="5"/>
    <ellipse cx="604" cy="1260" rx="238" ry="34" fill="url(#gold)" stroke="#6E4A22" stroke-width="6"/>

    <path d="M504 324C508 256 542 220 604 220C667 220 700 256 704 324H504Z" fill="url(#blackMetal)" stroke="#C8A45D" stroke-width="7"/>
    <path d="M480 310H728L700 376H508L480 310Z" fill="url(#gold)" stroke="#F0D99A" stroke-width="6"/>
    <ellipse cx="604" cy="217" rx="86" ry="28" fill="#0A0908" stroke="#B89552" stroke-width="6"/>

    <path d="M652 578C785 586 835 649 826 752C817 858 965 871 1000 780" stroke="#0B0A09" stroke-width="54" stroke-linecap="round"/>
    <path d="M652 578C785 586 835 649 826 752C817 858 965 871 1000 780" stroke="#B89552" stroke-width="12" stroke-linecap="round" opacity=".78"/>
    <path d="M973 748L1056 680" stroke="url(#gold)" stroke-width="40" stroke-linecap="round"/>
    <path d="M978 744L1059 678" stroke="#0A0908" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g opacity=".44" style="mix-blend-mode:screen">
    <path d="M486 930C545 900 659 902 724 934" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M584 375H624" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M576 835C610 821 655 829 685 850" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M520 1030C572 1050 646 1050 700 1030" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g opacity=".14" filter="url(#grain)">
    <rect width="1200" height="1400" fill="#fff"/>
  </g>
</svg>
