<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ODIN Lounge Bar - преміальне онлайн меню українською." />
    <meta name="theme-color" content="#080706" />
    <title>ODIN Lounge Bar | Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="loader" id="loader" aria-live="polite">
      <div class="loader__smoke"></div>
      <img src="assets/odin-logo.jpg" alt="ODIN Lounge Bar" class="loader__logo" />
      <div class="loader__line"></div>
    </div>

    <header class="site-header" data-animate>
      <a href="#home" class="brand" aria-label="ODIN Lounge Bar home">
        <img src="assets/odin-logo.jpg" alt="" />
        <span>ODIN</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Основне меню"></nav>
    </header>

    <main>
      <section class="hero section" id="home" aria-label="ODIN Lounge Bar">
        <div class="hero__media hero__media--ambient" aria-hidden="true"></div>
        <div class="hero__texture" aria-hidden="true"></div>
        <div class="hero__shade"></div>
        <div class="rune-field" aria-hidden="true">
          <span>ᛟ</span><span>ᛞ</span><span>ᛁ</span><span>ᚾ</span>
        </div>
        <div class="hero__content" data-animate>
          <img src="assets/odin-logo.jpg" alt="ODIN Lounge Bar" class="hero__crest" />
          <p class="eyebrow">Lounge Bar • Menu</p>
          <h1>ODIN</h1>
          <div class="hero-menu" id="hero-menu" aria-label="Категорії ODIN"></div>
        </div>
      </section>

      <section class="intro-strip" data-animate>
        <p>ᚨ ᛟ ᛞ ᛁ ᚾ</p>
        <span>Food</span>
        <span>Alcohol</span>
        <span>Zero proof</span>
        <span>Hookah</span>
        <p>ᚨ ᛟ ᛞ ᛁ ᚾ</p>
      </section>

      <section class="menu-book" id="menu-book" aria-live="polite" aria-label="Відкрите меню ODIN">
        <div class="menu-book__shell">
          <button class="menu-book__close" type="button" aria-label="Назад до головного меню">Назад</button>
          <div class="menu-book__art" aria-hidden="true"></div>
          <div class="menu-book__content">
            <div class="menu-book__head">
              <p class="section-kicker" id="book-eyebrow">Menu</p>
              <h2 id="book-title">ODIN</h2>
            </div>
            <div class="menu-book__tabs" id="book-tabs"></div>
            <div class="menu-book__pages" id="menu-root"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <img src="assets/odin-logo.jpg" alt="" />
      <p>ODIN Lounge Bar</p>
      <span>Темний смак, холодні напої, дим і вечори, що тривають довше.</span>
    </footer>

    <script src="scripts/menu-data.js"></script>
    <script src="scripts/hookah-scene.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
